name: Despacho Diario de Clima

on:
  schedule:
    # Corre todos los días a las 06:14 AM (Hora Argentina UTC-3 -> 09:14 UTC)
    # Usar el minuto 14 evita la congestión del minuto 0 en GitHub
    - cron: '14 9 * * *'
  workflow_dispatch:

jobs:
  ejecutar-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Ejecutar script de clima
        env:
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_GERARDO: ${{ secrets.TELEGRAM_CHAT_ID_GERARDO }}
          TELEGRAM_CHAT_ID_VALERIA: ${{ secrets.TELEGRAM_CHAT_ID_VALERIA }}
        run: python main.py
